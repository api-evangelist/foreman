aid: foreman
name: Foreman
description: >-
  Foreman (foreman.co) is an all-in-one, AI-powered project management and estimating
  platform built for construction contractors and the trades. It consolidates the full
  lifecycle of a construction job into one place: AI-assisted blueprint takeoffs and
  scoped estimates, branded proposals and e-signature, invoicing and online payments
  with QuickBooks sync, scheduling with critical-path task dependencies, and centralized
  document management for plans, permits, photos, change orders, and RFI communications.
  A Y Combinator (Winter 2026) company founded by Nolan Rossi, Foreman aims to keep
  contractors on the job site instead of behind a desk. As an early-stage product it
  currently exposes no public developer API; this profile was surfaced as a Y Combinator
  portfolio lead and enriched with published company identity and link properties.
